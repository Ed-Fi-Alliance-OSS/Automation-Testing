name: Create GitHub Issue from Jira agent

# Triggered on-demand by the Jira AI bridge agent (see Jira instructions.md) via a
# workflow_dispatch call. The agent composes the title/body/labels; this workflow is a
# thin receiver that:
#   - strips the Jira link out of the body, then
#   - creates the issue ATOMICALLY with the clean body + native issue Type + Priority +
#     the "Jira Support Key" field all set in a single GraphQL createIssue mutation, then
#   - applies plain labels and writes a Jira remote (web) link back (both best-effort).
# Setting the Jira Support Key in the same mutation that creates the issue means the
# issue can never exist without its Jira linkage (no create-then-set window, no orphan).

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Issue title (Jira summary)"
        required: true
        type: string
      body:
        description: "Issue body in Markdown (includes the Jira browse link)"
        required: true
        type: string
      labels:
        description: "Comma-separated labels (optional), e.g. dms-platform,bug,priority:medium"
        required: false
        type: string
        default: ""

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create issue (atomic) with Jira Support Key, Type, Priority
        uses: actions/github-script@v7
        env:
          # Pass inputs through env (not string-interpolated into the script) to avoid
          # script injection from Jira-sourced content.
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_LABELS: ${{ inputs.labels }}
          # Jira credentials for writing the remote (web) link back onto the ticket.
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.CREATE_JIRA_TICKET_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.CREATE_JIRA_TICKET_PAT }}
        with:
          script: |
            const { owner, repo } = context.repo;

            const title = (process.env.INPUT_TITLE || '').trim();
            const rawBody = process.env.INPUT_BODY || '';
            const labelsInput = process.env.INPUT_LABELS || '';

            const SUPPORT_FIELD_NAME = 'Jira Support Key';
            const PRIORITY_FIELD_NAME = 'Priority';

            // 1. Validate title -------------------------------------------------------
            if (!title) {
              core.setFailed('The "title" input is empty. A GitHub issue requires a title.');
              return;
            }

            // 2. Parse labels: "type:*" → native issue Type, "priority:*" → Priority
            //    field, everything else stays a normal label (applied post-create).
            // Unmapped type:/priority: values are dropped entirely (not kept as labels).
            const TYPE_MAP = { feature: 'Feature', enhancement: 'Feature', bug: 'Bug' };
            const PRIORITY_MAP = { critical: 'Urgent', high: 'High', medium: 'Medium', low: 'Low' };

            let typeName = null;       // native issue-type name to set (or null)
            let priorityName = null;   // Priority option name to set (or null)
            const plainLabels = [];

            for (const raw of labelsInput.split(',').map(s => s.trim()).filter(Boolean)) {
              const lower = raw.toLowerCase();
              if (lower.startsWith('type:')) {
                const mapped = TYPE_MAP[lower.slice(5).trim()];
                if (mapped) typeName = mapped;
                else core.info(`Dropping unmapped type label "${raw}"`);
              } else if (lower.startsWith('priority:')) {
                const mapped = PRIORITY_MAP[lower.slice(9).trim()];
                if (mapped) priorityName = mapped;
                else core.info(`Dropping unmapped priority label "${raw}"`);
              } else {
                plainLabels.push(raw);
              }
            }

            // 3. Extract the Jira browse link from the body --------------------------
            // The browse-URL shape is stable, so it is the reliable anchor regardless
            // of the surrounding Markdown the agent produced.
            const jiraUrlRegex = /https?:\/\/[a-z0-9.-]+\.atlassian\.net\/browse\/[A-Z][A-Z0-9]+-\d+/i;
            const jiraUrl = (rawBody.match(jiraUrlRegex) || [])[0] || null;
            if (!jiraUrl) {
              core.warning(`No Jira browse link found in body; "${SUPPORT_FIELD_NAME}" will be left unset.`);
            }

            // Helper: remove the Jira link (and any footer left behind) from a body.
            const stripJiraLink = (text, url) => {
              const escaped = url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const mdLinkRe = new RegExp(`\\[[^\\]]*\\]\\(${escaped}\\)`, 'g');
              const urlRe = new RegExp(escaped, 'g');
              const urlTest = new RegExp(escaped);

              const out = [];
              for (const line of text.split('\n')) {
                if (!urlTest.test(line)) { out.push(line); continue; }
                // Remove the markdown link and any bare URL from the line.
                const l = line.replace(mdLinkRe, '').replace(urlRe, '').trim();
                // Decide whether anything MEANINGFUL remains, ignoring footer
                // scaffolding: empty-link remnants, emphasis/quote markers, a leading
                // "Label:" prefix (any wording, e.g. "Ref:", "Originating Jira Ticket:"),
                // and separators / whitespace / table pipes.
                const skeleton = l
                  .replace(/\[\s*\]\(\s*\)/g, '')
                  .replace(/[*_`>]+/g, ' ')
                  .replace(/^[\s-]*[A-Za-z][\w .\/-]*:/, '')
                  .replace(/[-\s|]+/g, '')
                  .trim();
                // Pure footer scaffolding (label + emphasis, nothing else) → drop line.
                if (skeleton === '') continue;
                out.push(l);
              }
              let cleaned = out.join('\n').replace(/\s+$/, '');
              // Remove up to a few trailing horizontal rules left dangling as a footer.
              for (let i = 0; i < 3; i++) {
                const trimmed = cleaned.replace(/(?:\r?\n)+[ \t]*(?:-{3,}|\*{3,}|_{3,})[ \t]*$/, '');
                if (trimmed === cleaned) break;
                cleaned = trimmed.replace(/\s+$/, '');
              }
              return cleaned;
            };

            const cleanedBody = jiraUrl ? stripJiraLink(rawBody, jiraUrl) : rawBody;

            // 4. Resolve everything the atomic create needs (repo id, issue types,
            //    issue fields) in one query.
            const meta = await github.graphql(`
              query($owner:String!, $repo:String!) {
                repository(owner:$owner, name:$repo) {
                  id
                  issueTypes(first:20) { nodes { id name } }
                  issueFields(first:100) {
                    nodes {
                      __typename
                      ... on IssueFieldText { id name }
                      ... on IssueFieldSingleSelect { id name options { id name } }
                    }
                  }
                }
              }`, { owner, repo });
            const repositoryId = meta.repository.id;
            const typeNodes = meta.repository.issueTypes.nodes || [];
            const fieldNodes = meta.repository.issueFields.nodes || [];

            // Support Key is linkage-critical: if a Jira link exists but the field does
            // not, fail fast BEFORE creating anything (no orphan possible).
            let supportFieldId = null;
            if (jiraUrl) {
              const f = fieldNodes.find(n => n.name === SUPPORT_FIELD_NAME);
              if (!f) {
                core.setFailed(
                  `"${SUPPORT_FIELD_NAME}" issue field not found. Available: ` +
                  fieldNodes.map(n => n.name).filter(Boolean).join(', '));
                return;
              }
              supportFieldId = f.id;
            }

            // Type + Priority are best-effort: resolve if present, warn (do not fail) if not.
            let issueTypeId = null;
            if (typeName) {
              const t = typeNodes.find(n => n.name === typeName);
              if (t) issueTypeId = t.id;
              else core.warning(`Issue type "${typeName}" not found; leaving type unset.`);
            }
            let priorityFieldId = null, priorityOptionId = null;
            if (priorityName) {
              const pf = fieldNodes.find(n => n.name === PRIORITY_FIELD_NAME && Array.isArray(n.options));
              const opt = pf && pf.options.find(o => o.name === priorityName);
              if (!pf) core.warning(`"${PRIORITY_FIELD_NAME}" field not found; leaving priority unset.`);
              else if (!opt) core.warning(`Priority option "${priorityName}" not found; leaving priority unset.`);
              else { priorityFieldId = pf.id; priorityOptionId = opt.id; }
            }

            // 5. Create the issue ATOMICALLY: clean body + Support Key + Type + Priority
            //    all in one mutation. The issue cannot exist without its Jira Support Key,
            //    so there is no create-then-set window and no orphan. Creating with a
            //    clean body also means the Atlassian "GitHub for Jira" app never sees a
            //    Jira key to associate, so it never injects a backlink into the body.
            const issueFields = [];
            if (supportFieldId) issueFields.push({ fieldId: supportFieldId, textValue: jiraUrl });
            if (priorityFieldId && priorityOptionId) {
              issueFields.push({ fieldId: priorityFieldId, singleSelectOptionId: priorityOptionId });
            }
            const input = { repositoryId, title, body: cleanedBody };
            if (issueTypeId) input.issueTypeId = issueTypeId;
            if (issueFields.length) input.issueFields = issueFields;

            const createRes = await github.graphql(`
              mutation($input: CreateIssueInput!) {
                createIssue(input: $input) { issue { number id url } }
              }`, { input });
            const issue = createRes.createIssue.issue;
            core.info(`Created issue #${issue.number}: ${issue.url}`);
            if (jiraUrl) core.info(`Set "${SUPPORT_FIELD_NAME}" = ${jiraUrl} (atomic)`);
            if (issueTypeId) core.info(`Set issue type = ${typeName} (atomic)`);
            if (priorityOptionId) core.info(`Set Priority = ${priorityName} (atomic)`);

            // 6. Apply plain labels (best-effort; not linkage-critical). Create any that
            //    do not yet exist so the apply never fails on an unknown label.
            if (plainLabels.length) {
              for (const name of plainLabels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name });
                } catch (e) {
                  if (e.status === 404) {
                    try {
                      await github.rest.issues.createLabel({ owner, repo, name });
                      core.info(`Created label "${name}"`);
                    } catch (ce) {
                      core.warning(`Could not create label "${name}": ${ce.message}`);
                    }
                  } else {
                    core.warning(`Could not check label "${name}": ${e.message}`);
                  }
                }
              }
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: plainLabels,
                });
                core.info(`Applied labels: ${plainLabels.join(', ')}`);
              } catch (err) {
                core.warning(`Could not apply labels: ${err.message}`);
              }
            }

            // 7. Write a Jira remote (web) link back to the GitHub issue (best-effort).
            // Provides the Jira → GitHub direction (the field is GitHub → Jira) and is how
            // the created issue's URL reaches Jira. A failure only warns: the Support Key
            // field is already set atomically, so a missing remote link never orphans the
            // issue. A separate reconciliation workflow repairs any missing remote link.
            if (jiraUrl) {
              const jiraKey = (jiraUrl.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/i) || [])[1];
              const base = process.env.JIRA_BASE_URL;
              const email = process.env.JIRA_USER_EMAIL;
              const token = process.env.JIRA_API_TOKEN;
              if (!jiraKey || !base || !email || !token) {
                core.warning('Jira key or credentials not available; skipping Jira remote link.');
              } else {
                try {
                  const auth = 'Basic ' + Buffer.from(`${email}:${token}`).toString('base64');
                  const res = await fetch(`${base}/rest/api/3/issue/${jiraKey}/remotelink`, {
                    method: 'POST',
                    headers: {
                      Authorization: auth,
                      Accept: 'application/json',
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                      object: {
                        url: issue.url,
                        title: `GitHub Issue #${issue.number}: ${title}`,
                        icon: { url16x16: 'https://github.com/favicon.ico', title: 'GitHub' },
                      },
                    }),
                  });
                  if (!res.ok) {
                    core.warning(`Failed to add Jira remote link to ${jiraKey}: HTTP ${res.status} ${await res.text()}`);
                  } else {
                    core.info(`Added Jira remote link on ${jiraKey} → ${issue.url}`);
                  }
                } catch (err) {
                  core.warning(`Could not add Jira remote link to ${jiraKey}: ${err.message}`);
                }
              }
            }

            // 8. Job summary ---------------------------------------------------------
            await core.summary
              .addHeading('Jira → GitHub issue created', 2)
              .addList([
                `Issue: #${issue.number}`,
                `URL: ${issue.url}`,
                `Type: ${issueTypeId ? typeName : '(none)'}`,
                `Priority: ${priorityOptionId ? priorityName : '(none)'}`,
                `Labels: ${plainLabels.join(', ') || '(none)'}`,
                `${SUPPORT_FIELD_NAME}: ${jiraUrl || '(no Jira link found in body)'}`,
              ])
              .write();
